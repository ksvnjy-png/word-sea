<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>서희의 단어 바다</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#D6F1F5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="단어 바다">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
      .then(function (reg) { reg.update(); })
      .catch(function () {});
  });
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12343b; --sub:#5b7c83; --teal:#0e7c86; --teal-d:#0a5f67; --aqua:#e6f7f8;
  --coral:#ff7a59; --coral-d:#d95a3b; --ok:#22a55b; --ok-d:#17803f; --ok-bg:#e3f7ea;
  --bad:#e5484d; --bad-d:#b3262b; --bad-bg:#fde8e8; --line:#d7eaec; --sel:#fff4c2; --sel-b:#f5b800;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Jua',system-ui,-apple-system,sans-serif;color:var(--ink);
  background:linear-gradient(180deg,#d6f1f5 0%,#eef9fb 40%,#fbfeff 100%);min-height:100vh;
  -webkit-tap-highlight-color:transparent}
.en{font-family:'Nunito',system-ui,sans-serif;font-weight:800;letter-spacing:.2px}
.wrap{max-width:780px;margin:0 auto;padding:14px 14px 56px}
button{font-family:inherit;color:inherit}
.btn{appearance:none;border:0;border-radius:18px;padding:14px 20px;font-size:20px;cursor:pointer;
  background:var(--teal);color:#fff;box-shadow:0 4px 0 var(--teal-d);transition:transform .08s,box-shadow .08s;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.2}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--teal-d)}
.btn.ghost{background:#fff;color:var(--teal);box-shadow:inset 0 0 0 2px var(--line),0 3px 0 var(--line)}
.btn.ok{background:var(--ok);box-shadow:0 4px 0 var(--ok-d)}
.btn.bad{background:var(--bad);box-shadow:0 4px 0 var(--bad-d)}
.btn.coral{background:var(--coral);box-shadow:0 4px 0 var(--coral-d)}
.btn.big{font-size:24px;padding:18px 22px;border-radius:22px}
.btn.small{font-size:16px;padding:9px 14px;border-radius:14px}
.btn.full{width:100%}
.btn:disabled{opacity:.45;pointer-events:none}
.card{background:#fff;border-radius:26px;padding:20px;box-shadow:0 8px 24px rgba(14,124,134,.10)}
.center{text-align:center}
.muted{color:var(--sub);font-size:16px}
.note{background:#fff7e6;border-radius:14px;padding:12px 14px;color:#8a5a00;font-size:16px;margin:12px 0}
.err{background:var(--bad-bg);border-radius:14px;padding:12px 14px;color:var(--bad-d);font-size:17px;margin:12px 0}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.row .btn{flex:1;min-width:140px}
h2.sec{font-size:22px;margin:28px 4px 10px;font-weight:400}
.mt{margin-top:16px}

/* home */
.hero{text-align:center;padding:26px 0 18px}
.hero .wave{font-size:64px;line-height:1;animation:bob 3s ease-in-out infinite}
.hero h1{font-size:40px;margin:10px 0 4px;font-weight:400;color:var(--teal-d)}
.hero p{margin:0;color:var(--sub);font-size:18px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.units{display:grid;gap:12px}
.unit{display:flex;align-items:center;gap:8px;padding:14px 14px 14px 18px}
.unit-main{flex:1;text-align:left;background:none;border:0;cursor:pointer;padding:4px 0}
.unit-name{font-size:21px;color:var(--teal-d);margin-bottom:4px}
.icon-btn{appearance:none;border:0;background:var(--aqua);border-radius:14px;width:46px;height:46px;font-size:20px;cursor:pointer;flex:none}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:17px}
.speedrow{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:28px;color:var(--sub)}

/* upload */
.drop{border:3px dashed var(--line);border-radius:22px;padding:22px;text-align:center;background:#fbfeff}
.drop input{display:none}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:14px}
.thumb{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:3/4;background:#eee}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:6px;right:6px;border:0;border-radius:50%;width:30px;height:30px;background:rgba(0,0,0,.55);color:#fff;font-size:16px;cursor:pointer}
.spinner{width:54px;height:54px;border-radius:50%;border:6px solid var(--aqua);border-top-color:var(--teal);animation:spin 1s linear infinite;margin:10px auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.field{display:block;font-size:17px;color:var(--sub);margin-bottom:6px}
.inp{width:100%;font-size:18px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);font-family:'Nunito','Jua',sans-serif;font-weight:700;color:var(--ink);background:#fff}
.inp:focus{outline:none;border-color:var(--teal)}
.erow{display:grid;grid-template-columns:30px 1fr 1.2fr 40px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.erow .no{color:var(--sub);text-align:center;font-family:'Nunito';font-weight:800}
.erow .inp{padding:10px 10px;font-size:17px}
.erow .alts{grid-column:2 / 4;font-size:14px;padding:7px 10px;color:var(--sub);font-family:'Jua',sans-serif;font-weight:400;border-style:dashed}
.erow .x{border:0;background:var(--bad-bg);color:var(--bad);border-radius:12px;height:40px;font-size:18px;cursor:pointer}
.count{display:inline-block;background:var(--aqua);color:var(--teal-d);border-radius:999px;padding:4px 14px;font-size:18px}

/* learn shell */
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.top-title{flex:1;font-size:18px;color:var(--teal-d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{border:0;background:#fff;border-radius:999px;padding:9px 14px;font-size:15px;cursor:pointer;box-shadow:inset 0 0 0 2px var(--line);white-space:nowrap}
.steps{display:flex;gap:6px;margin-bottom:16px}
.step{flex:1;min-width:0;text-align:center;padding:9px 2px;border-radius:14px;background:#fff;color:var(--sub);font-size:15px;border:2px solid var(--line);cursor:pointer;white-space:nowrap}
.step.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.step.done:not(.on){color:var(--ok);border-color:#bfe8cf;background:var(--ok-bg)}

.bigword{font-size:clamp(46px,13vw,88px);line-height:1.1;margin:10px 0 6px;word-break:break-word;color:var(--ink)}
.meaning{font-size:24px;color:var(--sub);min-height:32px}
.label{display:inline-block;background:var(--aqua);color:var(--teal-d);border-radius:999px;padding:6px 16px;font-size:18px}
.dots{display:flex;gap:10px;justify-content:center;margin:14px 0 2px}
.dot{width:16px;height:16px;border-radius:50%;background:var(--line);transition:background .2s}
.dot.on{background:var(--coral)}
.progress{height:12px;border-radius:999px;background:#fff;overflow:hidden;box-shadow:inset 0 0 0 2px var(--line);margin:4px 0 14px}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#2bb5be);border-radius:999px;transition:width .3s}
.ptext{display:flex;justify-content:space-between;color:var(--sub);font-size:16px;margin:0 2px 6px}

.list{margin-top:16px;display:grid;gap:6px}
.li{display:grid;grid-template-columns:34px 1fr 1.2fr;gap:8px;align-items:center;background:#fff;border-radius:14px;padding:10px 12px;border:2px solid transparent;transition:all .2s}
.li .no{color:var(--sub);font-family:'Nunito';font-weight:800}
.li .w{font-size:19px}
.li .m{color:var(--sub);font-size:16px}
.li.cur{border-color:var(--coral);background:#fff3ee}
button.li{width:100%;text-align:left;cursor:pointer;font-family:inherit;color:inherit;font-size:inherit}
button.li:active{transform:scale(.98)}
.listhint{text-align:center;color:var(--sub);font-size:15px;margin:16px 0 -6px}
.li.past{opacity:.6}
.next{margin-top:18px}

.hint{text-align:center;font-size:19px;margin:4px 0 14px;color:var(--teal-d)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.wcard{position:relative;border:0;background:#fff;border-radius:18px;padding:14px 10px 12px;cursor:pointer;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .08s}
.wcard:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.wcard .no{position:absolute;top:8px;left:10px;color:var(--sub);font-size:13px;font-family:'Nunito';font-weight:800}
.wcard .w{font-size:22px;margin-top:6px}
.wcard .m{font-size:15px;color:var(--sub);text-align:center}
.wcard .badge{position:absolute;top:6px;right:8px;font-size:12px;background:var(--aqua);color:var(--teal-d);border-radius:999px;padding:2px 7px}
.wcard.playing{background:#fff3ee;box-shadow:0 4px 0 #ffc9b8}
.wcard.okc{background:var(--ok-bg);box-shadow:0 4px 0 #bfe8cf;color:var(--ok-d);cursor:default}
.wcard.badc{background:var(--bad-bg);box-shadow:0 4px 0 #f6c3c4;color:var(--bad-d);cursor:default}
.wcard.okc .w,.wcard.badc .w{opacity:.85}
.parent{color:var(--sub);font-size:15px;margin-top:10px}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(18,52,59,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fade .15s}
.sheet{background:#fff;width:100%;max-width:640px;border-radius:28px 28px 0 0;padding:22px 20px 30px;text-align:center;animation:up .2s ease-out}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.reveal{font-size:28px;color:var(--teal-d);background:var(--aqua);border-radius:18px;padding:14px;margin-top:14px}

/* matching */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col{display:grid;gap:var(--g,8px);align-content:start}
.mi{border:0;background:#fff;border-radius:14px;padding:var(--p,12px) 10px;font-size:var(--fs,18px);cursor:pointer;box-shadow:0 3px 0 var(--line);text-align:center;line-height:1.25;transition:background .15s,opacity .3s,transform .08s;min-height:44px}
.mi.en{font-size:calc(var(--fs,18px) + 2px)}
.mi.sel{background:var(--sel);box-shadow:0 3px 0 var(--sel-b),inset 0 0 0 3px var(--sel-b)}
.mi.done{background:var(--ok-bg);color:var(--ok-d);box-shadow:none;opacity:.55;cursor:default}
.mi.wrong{background:var(--bad-bg);color:var(--bad-d);box-shadow:inset 0 0 0 3px var(--bad);animation:shake .4s}
.colhead{text-align:center;color:var(--sub);font-size:16px;margin-bottom:2px}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

.banner{text-align:center;padding:26px 18px}
.banner .em{font-size:60px;line-height:1}
.banner h3{font-size:30px;font-weight:400;margin:10px 0 6px}
.stats{display:grid;gap:10px;margin-top:18px;text-align:left}
.stat{display:flex;justify-content:space-between;align-items:center;background:var(--aqua);border-radius:16px;padding:14px 18px;font-size:19px}
.stat b{font-weight:400;color:var(--teal-d);font-size:22px}

.btn.mic{background:#7c4dff;box-shadow:0 4px 0 #5a2fd6;min-width:220px}
.btn.mic.on{background:var(--bad);box-shadow:0 4px 0 var(--bad-d);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
.judge{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:18px;color:var(--sub);font-size:15px}
.judge .btn{min-width:56px}
.heard{margin-top:12px;background:#f3f0ff;color:#4b2fb3;border-radius:14px;padding:10px 14px;font-size:18px}

.hero .wave{display:inline-block}
.hero .wave svg{display:block;filter:drop-shadow(0 8px 14px rgba(14,124,134,.18))}
.hero .nick{display:inline-block;background:#fff;border-radius:999px;padding:4px 14px;color:var(--coral);font-size:16px;margin-top:6px;box-shadow:0 3px 0 var(--line)}
.cat{display:inline-block;border-radius:999px;padding:3px 10px;font-size:13px;font-family:'Nunito',sans-serif;font-weight:800;vertical-align:middle}
.cat.br{background:#e3f1ff;color:#1d5fa8}
.cat.wi{background:#ffeee6;color:#c4512d}
.filters{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap}
.filters .chip.on{background:var(--teal);color:#fff;box-shadow:none}
.catpick{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.catpick .chip.on{background:var(--teal);color:#fff;box-shadow:none}
#react{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:60;opacity:0;transition:opacity .15s}
#react.show{opacity:1}
#react .rbox{background:#fff;border-radius:34px;padding:14px 30px 18px;box-shadow:0 18px 50px rgba(0,0,0,.2);text-align:center;transform:scale(.6);transition:transform .3s cubic-bezier(.2,1.7,.4,1)}
#react.show .rbox{transform:scale(1)}
#react .rt{font-size:30px;margin-top:2px}
#react .yay .rt{color:var(--ok-d)}
#react .meh .rt{color:#e0466e}
#react.show .yay svg{animation:hop .5s ease-in-out 2}
#react.show .meh svg{animation:wig .35s ease-in-out 3}
@keyframes hop{50%{transform:translateY(-14px)}}
@keyframes wig{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.finale{position:relative;overflow:hidden;text-align:center;background:linear-gradient(180deg,#fff0f5 0%,#fff9e8 45%,#fff 100%);padding:26px 18px 22px}
.finale > *:not(.confetti){position:relative}
.confetti{position:absolute;inset:0;pointer-events:none}
.confetti i{position:absolute;top:-14px;width:10px;height:14px;border-radius:3px;opacity:.85;animation:fall linear infinite}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(760px) rotate(540deg)}}
.fin-char{display:inline-block;animation:hop 1.4s ease-in-out infinite}
.fin-char svg{display:block;filter:drop-shadow(0 10px 16px rgba(224,70,110,.2))}
.love{font-size:clamp(28px,8vw,40px);line-height:1.35;color:#e0466e;margin:8px 0 4px;text-shadow:0 3px 0 #ffe0ea}
.friends{display:flex;justify-content:center;gap:4px;margin:8px 0 2px;flex-wrap:wrap}
.friends span{display:inline-block;animation:hop .9s ease-in-out infinite}
.friends svg{width:58px;height:auto}
.floaty{position:absolute;font-size:30px;animation:floaty 3s ease-in-out infinite}
.floaty.l{left:8%;top:60px}.floaty.r{right:8%;top:90px;animation-delay:.8s}.floaty.l2{left:10%;top:170px;animation-delay:1.4s}.floaty.r2{right:9%;top:190px;animation-delay:.4s}
@keyframes floaty{50%{transform:translateY(-12px) scale(1.12)}}
.hero-scene{width:100%;max-width:440px;height:auto;display:block;margin:0 auto;border-radius:26px;box-shadow:0 10px 30px rgba(255,143,177,.25)}
.sc-sway{animation:scSway 4s ease-in-out infinite}
.sc-sway2{animation:scSway2 2.4s ease-in-out infinite}
.sc-girl{animation:scGirl 3s ease-in-out infinite}
.sc-hop{animation:scHop 1.8s ease-in-out infinite}
.sc-petal{transform-box:fill-box;transform-origin:center;animation:scPetal linear infinite;opacity:0}
.sc-fly1{animation:scFly1 12s ease-in-out infinite}
.sc-fly2{animation:scFly2 14s ease-in-out infinite}
.sc-flap{transform-box:fill-box;transform-origin:center;animation:scFlap .22s ease-in-out infinite alternate}
@keyframes scSway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
@keyframes scSway2{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes scGirl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes scHop{0%,60%,100%{transform:translateY(0)}20%{transform:translateY(-12px)}35%{transform:translateY(0)}45%{transform:translateY(-4px)}}
@keyframes scPetal{0%{transform:translate(0,0) rotate(0);opacity:0}8%{opacity:1}90%{opacity:1}100%{transform:translate(-50px,300px) rotate(420deg);opacity:0}}
@keyframes scFly1{0%,100%{transform:translate(60px,70px)}25%{transform:translate(150px,30px)}50%{transform:translate(250px,75px)}75%{transform:translate(165px,115px)}}
@keyframes scFly2{0%,100%{transform:translate(300px,45px)}25%{transform:translate(215px,95px)}50%{transform:translate(110px,50px)}75%{transform:translate(210px,22px)}}
@keyframes scFlap{from{transform:scaleX(1)}to{transform:scaleX(.3)}}
@media (prefers-reduced-motion:reduce){.hero-scene *{animation:none!important}.sc-petal{opacity:0}}
.row .btn{white-space:nowrap}
.label.live{background:#ffe3ec;color:#d6336c;animation:pulse 1s ease-in-out infinite}
.resetchip{border:0;background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--sub);box-shadow:inset 0 0 0 1.5px var(--line);cursor:pointer;margin-left:6px;vertical-align:middle}
.ustat{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ustat span{font-size:12px;border-radius:999px;padding:2px 9px;background:#eef3f4;color:var(--sub)}
.ustat span.on{background:var(--ok-bg);color:var(--ok-d)}
.ustat span.gold{background:#fff1c9;color:#9a6a00;font-weight:400}
@media (max-width:420px){.row .btn{min-width:0;padding-left:12px;padding-right:12px}.row .btn.big{font-size:19px}}
.mcard{padding:14px 14px 10px;margin-bottom:12px}
.mhead{display:flex;justify-content:space-between;align-items:baseline;font-size:19px;margin:0 4px 8px}
.mrow{display:grid;grid-template-columns:1fr 1.1fr auto auto;gap:8px;align-items:center;width:100%;border:0;background:var(--bad-bg);border-radius:12px;padding:10px 12px;margin-bottom:6px;cursor:pointer;text-align:left;font-family:inherit;color:inherit}
.mrow .w{font-size:18px;color:var(--bad-d)}
.mrow .m{font-size:15px;color:var(--sub)}
.mrow .cnt{font-size:13px;background:#fff;border-radius:999px;padding:2px 8px;color:var(--bad-d)}
.mempty{color:var(--ok-d);background:var(--ok-bg);border-radius:12px;padding:12px;text-align:center;font-size:16px;margin-bottom:4px}
.btn.okghost{background:#fff;color:var(--ok-d);box-shadow:inset 0 0 0 2px #bfe8cf,0 3px 0 #bfe8cf}
.qrimg{display:block;width:min(240px,70vw);margin:14px auto 8px;image-rendering:pixelated;background:#fff;padding:8px;border-radius:14px;box-shadow:0 0 0 2px var(--line)}
.qrimg.big{width:min(320px,86vw)}
@media (min-width:900px) and (orientation:landscape){
  .wrap{max-width:1240px;padding:16px 28px 48px}
  .home-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;align-items:start}
  .home-left{position:sticky;top:12px}
  .home-right .sec{margin-top:6px}
  .hero{padding-top:6px}
  .hero-scene{max-width:520px}
  .split{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:24px;align-items:start}
  .split-a{position:sticky;top:12px}
  .split-b .list{margin-top:0}
  .split-b .listhint{margin:0 0 10px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
  .card.center,.card.banner{max-width:820px;margin-left:auto;margin-right:auto}
  .progress,.ptext{max-width:820px;margin-left:auto;margin-right:auto}
  .match{max-width:1000px;margin:0 auto}
  .miss-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
  .miss-grid .mrow{grid-template-columns:1fr auto auto}
  .miss-grid .mrow .m{grid-column:1 / -1;grid-row:2}
  .steps{max-width:900px;margin-left:auto;margin-right:auto}
}
.clearcard{position:relative;overflow:hidden;text-align:center;background:linear-gradient(180deg,#fff4f8,#fffbea 60%,#fff);padding:22px 18px 20px;max-width:820px;margin:0 auto}
.clearcard > *:not(.confetti){position:relative}
.clear-chars{display:flex;align-items:flex-end;justify-content:center;gap:4px}
.clear-chars span{display:inline-block;animation:hop .9s ease-in-out infinite}
.clear-chars span:nth-child(3){animation-delay:.3s}
.clear-chars span.mid{animation-delay:.15s}
.clear-chars svg{width:78px;height:auto}
.clear-chars .mid svg{width:120px}

      <path d="M-9 -12 L-9 0 Q0 8 9 0 L9 -12 L4.5 -6 L0 -13 L-4.5 -6 Z" fill="${c}"/></g></g>`;
  const daisy = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})"><path d="M0 0 L0 22" stroke="#5DAE63" stroke-width="3" stroke-linecap="round"/>

}

const ANIMALS = ['bunny', 'cat', 'puppy', 'bear', 'chick'];
function animalSVG(kind, mood){
  const yay = mood !== 'meh';
  const C = {
    bunny:{fur:'#FFFFFF', edge:'#EADCE1', inner:'#FFC2D1'},
    cat:{fur:'#FFD49C', edge:'#F2B66B', inner:'#FFB0A3'},

  } else if (kind === 'cat'){
    back = `<path d="M36 74 L44 22 L80 50 Z" fill="${C.fur}" stroke="${C.edge}" stroke-width="3" stroke-linejoin="round"/><path d="M46 62 L50 36 L68 52 Z" fill="${C.inner}"/>

  } else if (kind === 'bear'){
    back = `<circle cx="42" cy="50" r="18" fill="${C.fur}" stroke="${C.edge}" stroke-width="3"/><circle cx="42" cy="50" r="9" fill="${C.inner}"/>
            <circle cx="118" cy="50" r="18" fill="${C.fur}" stroke="${C.edge}" stroke-width="3"/><circle cx="118" cy="50" r="9" fill="${C.inner}"/>`;
  } else if (kind === 'puppy'){
    front = `<ellipse cx="34" cy="86" rx="15" ry="30" transform="rotate(18 34 86)" fill="${C.ear}"/>
             <ellipse cx="126" cy="86" rx="15" ry="30" transform="rotate(-18 126 86)" fill="${C.ear}"/>
             <ellipse cx="100" cy="76" rx="13" ry="11" fill="${C.ear}" opacity=".35"/>`;
  } else if (kind === 'chick'){
    back = `<path d="M74 44 Q72 26 82 34 Q86 22 90 38" stroke="${C.edge}" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  }
  const head = `<circle cx="80" cy="92" r="50" fill="${C.fur}" stroke="${C.edge}" stroke-width="3"/>`;
  const eyes = yay
    ? `<path d="M56 90 Q64 79 72 90" stroke="#3A2A2A" stroke-width="5" fill="none" stroke-linecap="round"/>
       <path d="M88 90 Q96 79 104 90" stroke="#3A2A2A" stroke-width="5" fill="none" stroke-linecap="round"/>`
    : `<path d="M57 84 L70 91 L57 98" stroke="#3A2A2A" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
       <ellipse cx="97" cy="91" rx="6" ry="7.5" fill="#3A2A2A"/><circle cx="99" cy="88" r="2.4" fill="#fff"/>`;

  let mouth;
  if (kind === 'chick'){
    mouth = yay
      ? `<path d="M70 100 L90 100 L80 112 Z" fill="#FF9F2E" stroke="#E9851A" stroke-width="2" stroke-linejoin="round"/>`
      : `<path d="M71 100 L89 100 L80 108 Z" fill="#FF9F2E" stroke="#E9851A" stroke-width="2" stroke-linejoin="round"/>
         <path d="M75 107 Q75 124 80 124 Q85 124 85 107 Z" fill="#FF6F91"/><path d="M80 110 L80 119" stroke="#E0466E" stroke-width="2" stroke-linecap="round"/>`;
  } else {
    const nose = `<ellipse cx="80" cy="100" rx="5" ry="3.6" fill="${kind === 'bunny' ? '#FF9DB4' : '#4A3030'}"/>`;
    mouth = nose + (yay

    : `<g fill="#7FB3FF" opacity=".9"><path d="M134 54 Q140 64 134 70 Q128 64 134 54z"/></g>`;
  return `<svg viewBox="0 0 160 150" width="150" height="140" role="img" aria-label="${yay ? '정답 캐릭터' : '메롱 캐릭터'}">${back}${head}${front}${eyes}${cheeks}${mouth}${deco}</svg>`;

function react(ok, ms){
  const el = document.getElementById('react'); if (!el) return;

/* ---------- Claude API (사진 인식·뜻 채점) ---------- */
async function callClaude(model, content, maxTokens, signal){
  let r;
  try{
    r = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST', signal,
      headers:{'content-type':'application/json','x-api-key':S.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body: JSON.stringify({model, max_tokens:maxTokens, messages:[{role:'user', content}]})
    });
  }catch(e){ throw {code: e && e.name === 'AbortError' ? 'cancelled' : 'network'}; }
  if (!r.ok){ throw {code: r.status === 401 ? 'bad_key' : r.status === 429 ? 'rate_limited' : r.status === 400 ? 'bad_request' : 'upstream_error'}; }
  const j = await r.json();
  return (j.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
}
function parseJSON(t){

  if (c === 'image_rejected') return '이 사진은 읽을 수 없어요. 다른 사진(JPG/PNG)으로 해 주세요.';
  if (c === 'network') return '인터넷 연결을 확인해 주세요.';
  if (c === 'bad_request') return '요청이 거절됐어요. API 키의 크레딧(잔액)이 있는지 확인해 주세요.';
  return '단어를 읽지 못했어요. 다시 해 보거나 직접 입력해 주세요.';
}
async function extract(){
  const up = S.up;
  if (!S.apiKey || !up.files.length || up.busy) return;
  up.busy = true; up.err = ''; render();
  const ctl = new AbortController(); up.ctl = ctl;
  try{
    const imgs = await Promise.all(up.files.slice(0, 5).map(fileToJpegB64));
    const content = imgs.map(d => ({type:'image', source:{type:'base64', media_type:'image/jpeg', data:d}}));
    content.push({type:'text', text:PROMPT});
    const res = parseJSON(await callClaude(EXTRACT_MODEL, content, 4000, ctl.signal));
    const arr = Array.isArray(res) ? res : (res && Array.isArray(res.words) ? res.words : []);
    let words = arr.map((w, i) => ({
      no: Number(w && w.no) || i + 1,
      word: String((w && w.word) || '').trim(),
      meaning: String((w && w.meaning) || '').replace(/\s+/g, ' ').trim(),
      alts: String((w && (Array.isArray(w.alts) ? w.alts.join(', ') : w.alts)) || '').trim()
    })).filter(w => w.word);
    const seen = new Set();
    words = words.filter(w => { const k = w.word.toLowerCase().replace(/\s+/g, ' '); if (seen.has(k)) return false; seen.add(k); return true; })
      .map((w, i) => Object.assign(w, {no: i + 1}));
    if (!words.length) up.err = '단어를 찾지 못했어요. 표가 잘 보이게 다시 찍어 주세요.';
    else {
      up.words = words;
      if (!up.title && res && typeof res.title === 'string') up.title = res.title.trim();
      if (!up.cat && res && res.category) up.cat = catNorm(res.category);
    }
  }catch(e){
    if (!(e && e.code === 'cancelled')) up.err = errMsg(e);
  }
  up.busy = false; up.ctl = null; render();
}

function progKey(id){ return 'sw_prog_' + id; }
function addMiss(t, idx){
  if (idx == null) return;
  S.miss = S.miss || {t1:{}, t2:{}, t3:{}}; S.miss[t] = S.miss[t] || {};
  S.miss[t][idx] = (S.miss[t][idx] || 0) + 1;
}
function undoMiss(t, idx){
  if (!S.miss || !S.miss[t] || !S.miss[t][idx]) return;
  if (--S.miss[t][idx] <= 0) delete S.miss[t][idx];
}
function missCount(){ const m = S.miss || {}; return ['t1','t2','t3'].reduce((s, k) => s + Object.keys(m[k] || {}).length, 0); }
function saveProgress(){
  if (!S.unit) return;
  const n = S.unit.words.length;
  const t3 = S.t3 ? Object.assign({}, S.t3, {flash:null, selL:null, selR:null}) : null;
  LS.set(progKey(S.unit.id), {n, t1:S.t1, t2:S.t2, t3, stats:S.stats, done:S.done, rc:S.rc, miss:S.miss,

  if (S.done.t1 && S.done.t2 && S.done.t3){

}
function startUnit(u, fresh){
  stopAll();
  S.unit = {id:u.id, name:u.name, cat:catNorm(u.cat), words:u.words.map((w, i) => ({no: w.no || i + 1, word: w.word, meaning: w.meaning, alts: w.alts || '', okHeard: w.okHeard || ''}))};
  S.stats = {t1:0, t2:0, t3:0}; S.done = {}; S.rc = {};
  S.listen = {i:0, k:0, playing:false, finished:false};
  S.t1 = S.t2 = S.t3 = null; S.miss = {t1:{}, t2:{}, t3:{}};

    S.stats = Object.assign({t1:0, t2:0, t3:0}, pr.stats || {}); S.done = pr.done || {}; S.rc = pr.rc || {};
    S.miss = Object.assign({t1:{}, t2:{}, t3:{}}, pr.miss || {});
    if (pr.listen) S.listen = Object.assign({i:0, k:0, playing:false, finished:false}, pr.listen);
    const resumeAt = !S.done.t1 && S.t1 ? 't1' : !S.done.t2 && S.t2 ? 't2' : !S.done.t3 && S.t3 ? 't3' : 'listen';
    go(resumeAt);
    if (resumeAt !== 'listen') toast('하던 곳부터 이어서 해요 👍', 'good', 1600);

function go(screen){

  if (screen === 't3' && !S.t3) initT3();
  if (screen === 'listen' && S.listen && S.listen.finished) S.listen = {i:0, k:0, playing:false, finished:false};
  S.screen = screen; render(); window.scrollTo(0, 0);
}

/* ---------- listen ---------- */
async function runListen(){
  const my = ++listenRun; const L = S.listen, W = S.unit.words;
  if (L.finished){ L.i = 0; L.k = 0; L.finished = false; }
  L.playing = true; render(); scrollCur();
  await sleep(80);
  while (L.i < W.length){
    for (let k = L.k; k < REPEAT; k++){
      if (my !== listenRun) return;
      L.k = k; render(); if (k === 0) scrollCur();
      await speakOnce(W[L.i].word);
      if (my !== listenRun) return;
      await sleep(k < REPEAT - 1 ? 1000 : 1500);
    }
    if (my !== listenRun) return;
    L.k = 0; L.i++;
  }
  L.i = W.length - 1; L.playing = false; L.finished = true; S.done.listen = true;
  beep(true); render();
}
function scrollCur(){ const el = document.getElementById('curLi'); if (el && el.scrollIntoView) try { el.scrollIntoView({block:'nearest', behavior:'smooth'}); } catch(e){} }

/* ---------- test 1 ---------- */
function initT1(){ S.t1 = {round:1, queue:range(S.unit.words.length), pos:0, wrong:[], phase:'ask', stillWrong:[]}; S.stats.t1 = 0; }
async function t1Mic(){
  if (S.listening) { stopListen(); return; }
  const T = S.t1, w = S.unit.words[T.queue[T.pos]];
  T.heard = null; S.listening = 't1'; render();
  let alts;
  try { alts = await listen('en-US'); }
  catch(e){ S.listening = null; render(); toast(micErr(e), 'bad', 2600); return; }
  S.listening = null;
  if (S.screen !== 't1' || S.t1 !== T) return;
  if (!alts.length){
    T.empty = (T.empty || 0) + 1;
    if (T.empty >= 2){ T.heard = null; T.empty = 0; t1Answer(false); return; }
    render(); toast('잘 안 들렸어요 🙉 "지금 말해요!"가 보이면 읽어 봐요', '', 2400); return;
  }
  T.heard = alts[0]; T.empty = 0;
  const learned = String(w.okHeard || '').split(',').map(x => normEn(x)).filter(Boolean);
  t1Answer(matchEn(w.word, alts) || alts.some(a => learned.includes(normEn(a))));
}
function learn(idx, field, text){
  text = String(text || '').trim(); if (!text) return;
  const w = S.unit.words[idx]; if (!w) return;
  const set = new Set(String(w[field] || '').split(',').map(x => x.trim()).filter(Boolean));
  if (set.has(text)) return;
  set.add(text); w[field] = Array.from(set).join(', ');
  const list = LS.get('sw_units', []);
  const u = list.find(x => x.id === S.unit.id);
  if (u && u.words){ const uw = u.words.find(x => x.word === w.word); if (uw){ uw[field] = w[field]; LS.set('sw_units', list); } }
  const su = S.units.find(x => x.id === S.unit.id);
  if (su && su.words){ const sw = su.words.find(x => x.word === w.word); if (sw) sw[field] = w[field]; }
}
function t1Override(){
  const T = S.t1, idx = T.queue[T.pos];
  undoMiss('t1', idx);
  learn(idx, 'okHeard', T.heard);
  const k = T.wrong.lastIndexOf(idx); if (k >= 0) T.wrong.splice(k, 1);
  if (T.round === 1) S.stats.t1 = Math.max(0, S.stats.t1 - 1);
  else { const j = T.stillWrong.lastIndexOf(idx); if (j >= 0) T.stillWrong.splice(j, 1); }
  beep(true); react(true); t1Next();
}
function t1Answer(ok){
  const T = S.t1, idx = T.queue[T.pos];
  if (ok){ beep(true); react(true); T.heard = null; t1Next(); return; }
  beep(false); react(false);
  T.wrong.push(idx); if (T.round === 1) S.stats.t1++; else T.stillWrong.push(idx);
  addMiss('t1', idx);
  T.phase = 'wrongShow'; render();
  setTimeout(() => speak(S.unit.words[idx].word, 2), 350);
}
async function t1Retry(){
  if (S.listening){ stopListen(); return; }
  const T = S.t1, idx = T.queue[T.pos], w = S.unit.words[idx];
  stopSpeech(); S.listening = 't1r'; render();
  let alts;
  try { alts = await listen('en-US'); }
  catch(e){ S.listening = null; render(); toast(micErr(e), 'bad', 2600); return; }
  S.listening = null;
  if (S.screen !== 't1' || S.t1 !== T || T.phase !== 'wrongShow') return;
  if (!alts.length){ render(); toast('잘 안 들렸어요. 다시 해 보거나 "다음"을 눌러요', '', 2000); return; }
  const learned = String(w.okHeard || '').split(',').map(x => normEn(x)).filter(Boolean);
  if (matchEn(w.word, alts) || alts.some(a => learned.includes(normEn(a)))){
    const k = T.wrong.lastIndexOf(idx); if (k >= 0) T.wrong.splice(k, 1);
    if (T.round !== 1){ const j = T.stillWrong.lastIndexOf(idx); if (j >= 0) T.stillWrong.splice(j, 1); }
    beep(true); react(true); T.heard = null; t1Next(); return;
  }
  T.heard = alts[0]; beep(false); react(false); addMiss('t1', idx); render();
  setTimeout(() => speak(w.word, 1), 400);
}
function t1Next(){
  stopSpeech();
  const T = S.t1; T.pos++; T.heard = null; T.empty = 0;
  if (T.pos < T.queue.length){ T.phase = 'ask'; render(); return; }
  if (T.round === 1 && T.wrong.length){ T.phase = 'roundEnd'; render(); return; }
  T.phase = 'end'; finishTest('t1'); render(); window.scrollTo(0, 0);
}

/* ---------- test 2 ---------- */
function initT2(){
  const order = shuffle(range(S.unit.words.length));
  S.t2 = {round:1, order, pos:0, status:{}, active:order[0], revealed:false, result:null, heard:null, phase:null};
  S.stats.t2 = 0;
  setTimeout(() => t2Ask(S.t2), 500);
}
let t2AskToken = 0;
async function t2Ask(T){
  if (!T || S.t2 !== T || S.screen !== 't2' || T.active == null) return;
  const my = ++t2AskToken, idx = T.active;
  await speak(S.unit.words[idx].word, 1);
}
async function t2Mic(){
  if (S.listening){ stopListen(); return; }
  const T = S.t2; if (T.active == null) return;
  const w = S.unit.words[T.active];
  T.heard = null; T.result = null; S.listening = 't2'; render();
  let alts;
  try { alts = await listen('ko-KR'); }
  catch(e){ S.listening = null; render(); toast(micErr(e), 'bad', 2600); return; }
  S.listening = null;
  if (S.screen !== 't2' || S.t2 !== T || T.active == null) return;
  if (!alts.length){
    T.empty = (T.empty || 0) + 1;
    if (T.empty >= 2){ T.empty = 0; T.heard = null; beep(false); react(false); addMiss('t2', T.active); T.revealed = true; T.result = 'bad'; render(); return; }
    render(); toast('잘 안 들렸어요 🙉 "지금 말해요!"가 보이면 말해 봐요', '', 2400); return;
  }
  T.heard = alts[0]; T.empty = 0;
  let ok = matchKo(w.meaning, alts, w.alts, w.word);
  if (!ok && S.apiKey){ S.judging = true; render(); ok = await judgeKoAI(w, alts); S.judging = false; }
  if (S.t2 !== T || T.active == null) return;
  if (ok){ t2Answer(true); return; }
  beep(false); react(false); addMiss('t2', T.active); T.revealed = true; T.result = 'bad'; render();
}
function t2Answer(ok){
  const T = S.t2, i = T.active;
  T.heard = null; T.result = null;
  T.status[i] = ok ? 'ok' : 'bad';
  if (ok){ beep(true); react(true); } else { S.stats.t2++; }
  T.active = null; T.revealed = false; t2AskToken++;
  if (T.order.every(j => T.status[j])){
    if (T.order.some(j => T.status[j] === 'bad')) T.phase = 'retry';
    else { T.phase = 'clear'; finishTest('t2'); }
    render(); return;
  }
  T.pos = T.order.findIndex(j => !T.status[j]);
  T.active = T.order[T.pos];
  render();
  setTimeout(() => t2Ask(T), ok ? 1100 : 400);
}

/* ---------- test 3 ---------- */
function initT3(){ S.t3 = {right:shuffle(range(S.unit.words.length)), matched:{}, selL:null, selR:null, flash:null}; S.stats.t3 = 0; }
function t3Pick(side, i){
  const T = S.t3;
  if (T.matched[i] && ((side === 'l') || (side === 'r'))) return;
  if (T.flash) return;
  if (side === 'l') T.selL = (T.selL === i ? null : i); else T.selR = (T.selR === i ? null : i);
  if (T.selL != null && T.selR != null){
    if (T.selL === T.selR){
      T.matched[T.selL] = true; beep(true); react(true, 800);
      speak(S.unit.words[T.selL].word, 1);
      T.selL = T.selR = null;
      if (Object.keys(T.matched).length === S.unit.words.length){
        setTimeout(() => { finishTest('t3'); render(); window.scrollTo(0, 0); }, 800);
        render(); return;
      }
    } else {
      S.stats.t3++; beep(false); react(false, 1000); addMiss('t3', T.selL);
      T.flash = {l:T.selL, r:T.selR}; render();
      setTimeout(() => { T.flash = null; T.selL = T.selR = null; render(); }, 650); return;
    }
  }
  render();
}

function shell(inner){
  const mc = missCount();
  const steps = [['listen','듣기'],['review','복습'],['t1','테스트1'],['t2','테스트2'],['t3','테스트3'],['miss', mc ? `오답 ${mc}` : '오답']];
  return `<div class="top">
      <button class="icon-btn" data-act="home" aria-label="처음으로">🏠</button>
      <div class="top-title en">${S.unit.cat ? catBadge(S.unit.cat) + ' ' : ''}${esc(S.unit.name)}</div>

}

function viewListen(){
  const W = S.unit.words, L = S.listen, N = W.length;
  const started = L.playing || L.i > 0 || L.k > 0 || L.finished;
  const cur = W[Math.min(L.i, N - 1)];
  const card = `<div class="card center">
    <div class="label">${L.finished ? '다 들었어요! 👏' : started ? `${L.i + 1} / ${N}` : `${N}개 단어 · 단어마다 ${REPEAT}번씩`}</div>
    <div class="bigword en">${started ? esc(cur.word) : '🎧'}</div>
    <div class="meaning">${started ? esc(cur.meaning) : '잘 듣고 따라 말해 봐요'}</div>

      ? `<button class="btn big ghost" data-act="l-pause">⏸ 잠깐 멈춤</button>`

      <span class="no">${w.no}</span><span class="en w">${esc(w.word)}</span><span class="m">${esc(w.meaning)}</span></button>`;
  }).join('')}</div>`;
  return shell(`<div class="split"><div class="split-a">${card}<button class="btn big full next" data-act="go" data-to="review">다음: 모르는 단어 다시 듣기 →</button></div><div class="split-b">${list}</div></div>`);
}

function progress(done, total, left, right){

}

function viewMiss(){
  const W = S.unit.words, m = S.miss || {};
  const sec = (k, icon, title, sub) => {

    return `<div class="card mcard"><div class="mhead"><span>${icon} ${title}</span><span class="muted" style="font-size:14px">${sub}${ids.length ? ` · ${ids.length}개` : ''}</span></div>${body}</div>`;

}
function allDone(){ return !!(S.done.t1 && S.done.t2 && S.done.t3); }
function finishTest(k){

const TNAME = {t1:'테스트 1', t2:'테스트 2', t3:'테스트 3'};
const TWA = {t1:'과', t2:'와', t3:'과'}, TI = {t1:'이', t2:'가', t3:'이'};
function clearBlock(k, stat, extra){
  const left = ['t1','t2','t3'].filter(x => !S.done[x]);

  const pals = ['bunny', 'cat', 'puppy', 'bear', 'chick'].sort(() => Math.random() - .5).slice(0, 3);
  const titles = {t1:'영어 읽기', t2:'뜻 말하기', t3:'짝 맞추기'};
  return `<div class="card clearcard">
    <div class="confetti">${range(16).map(j => `<i style="left:${(j * 41) % 100}%;background:${['#FF7A9A','#FFD23F','#7FD1FF','#9B8CFF','#7BE0AD'][j % 5]};animation-delay:${(j % 7) * .4}s;animation-duration:${3 + (j % 3) * .7}s"></i>`).join('')}</div>

    ${extra || ''}
    <div class="row">${left.map((x, n) => `<button class="btn big ${n ? 'ghost' : 'coral'}" data-act="go" data-to="${x}">${TNAME[x]} 하러 가기 →</button>`).join('')}
      ${!left.length ? `<button class="btn big coral" data-act="go" data-to="done">🎉 축하 화면 보기</button>` : ''}</div>
  </div>`;

function viewT3(){

    return shell(`<div class="hint">테스트 3 · 뜻과 단어 짝 맞추기<button class="resetchip" data-act="reset-test" data-t="t3">🔁 처음부터</button></div>` + clearBlock('t3', `틀린 횟수 ${S.stats.t3}번`, ''));
  }
  const fs = N <= 8 ? 20 : N <= 12 ? 18 : N <= 16 ? 16 : N <= 22 ? 15 : 13;
  const pad = N <= 8 ? 16 : N <= 14 ? 12 : N <= 20 ? 9 : 7;
  const gap = N <= 14 ? 8 : 6;
  const m = Object.keys(T.matched).length;
  const L = range(N).map(i => {
    const cls = T.matched[i] ? 'done' : (T.flash && T.flash.l === i) ? 'wrong' : (T.selL === i ? 'sel' : '');
    return `<button class="mi ${cls}" ${T.matched[i] ? 'disabled' : `data-act="m-l" data-i="${i}"`}>${esc(W[i].meaning)}</button>`;
  }).join('');
  const R = T.right.map(i => {
    const cls = T.matched[i] ? 'done' : (T.flash && T.flash.r === i) ? 'wrong' : (T.selR === i ? 'sel' : '');
    return `<button class="mi en ${cls}" ${T.matched[i] ? 'disabled' : `data-act="m-r" data-i="${i}"`}>${esc(W[i].word)}</button>`;
  }).join('');
  return shell(`<div class="hint">테스트 3 · 뜻과 단어 짝 맞추기<button class="resetchip" data-act="reset-test" data-t="t3">🔁 처음부터</button></div>
    ${progress(m, N, '왼쪽 뜻 → 오른쪽 단어', `${m} / ${N}`)}
    <div class="match" style="--fs:${fs}px;--p:${pad}px;--g:${gap}px">
      <div class="col"><div class="colhead">뜻</div>${L}</div>
      <div class="col"><div class="colhead">영어 단어</div>${R}</div>
    </div>`);
}

function handleImport(d){
  if (d && Array.isArray(d.multi)){
    let n = 0;
    d.multi.forEach(x => { try { saveImported(x, true); n++; } catch(e){} });
    if (!n) throw 0;
    stopAll(); S.screen = 'home'; S.confirmDel = null; render(); window.scrollTo(0, 0);
    toast('📥 단원 ' + n + '개를 가져왔어요!', 'good', 2400);
    return;
  }
  saveImported(d);
}
function saveImported(d, quiet){
    const words = (d.w || []).map((x, i) => ({no:i + 1, word:String(x[0] || '').trim(), meaning:String(x[1] || '').trim(), alts:String(x[2] || '').trim(), okHeard:''}))
      .filter(x => x.word && x.meaning);
    if (!words.length) throw 0;
    const name = String(d.t || '').trim() || ('단원 ' + new Date().toLocaleDateString('ko-KR'));
    const same = S.units.find(u => u.name === name && catNorm(u.cat) === catNorm(d.c));
    if (same) words.forEach(w => { const o = same.words.find(x => x.word === w.word); if (o && o.okHeard) w.okHeard = o.okHeard; });
    const u = {id: same ? same.id : ('u' + Date.now().toString(36) + (impSeq++)), name, cat: catNorm(d.c), words, createdAt: same ? same.createdAt : (Number(d.at) || Date.now())};
    if (quiet){ persistUnit(u); return name; }
    persistUnit(u).then(() => { stopAll(); S.screen = 'home'; S.confirmDel = null; render(); window.scrollTo(0, 0); toast('📥 ' + name + ' 저장됐어요!', 'good', 2200); });
}
async function importFromClipboard(){
  let txt = '';
  try { txt = await navigator.clipboard.readText(); } catch(e){ txt = ''; }
  txt = String(txt || '').trim();
  if (!txt){
    newUpload(); S.paste = ''; render();
    toast('복사한 내용을 아래 칸에 길게 눌러 붙여넣어 주세요', '', 2600); return;
  }
  const m = txt.match(/#import=([A-Za-z0-9+\-$_]+)/);
  if (m){
    LS.set('sw_lastimp', m[1]);
    try { handleImport(JSON.parse(LZString.decompressFromEncodedURIComponent(m[1]))); }
    catch(e){ toast('복사한 링크를 읽지 못했어요. 다시 복사해 주세요', 'bad', 2400); }
    return;
  }
  const ws = parsePaste(txt);
  if (!ws.length){ toast('복사한 내용에서 단어를 찾지 못했어요', 'bad', 2200); return; }
  const tm = txt.match(/^\s*(?:#|단원\s*[:：])\s*(.+)$/m), cm = txt.match(/^\s*분류\s*[:：]\s*(.+)$/m);
  saveImported({t: tm ? tm[1].trim() : '', c: cm ? cm[1] : '', w: ws.map(x => [x.word, x.meaning, x.alts || ''])});
}
async function autoClipImport(){
  try{
    if (document.visibilityState !== 'visible' || !navigator.clipboard || !navigator.permissions) return;
    const st = await navigator.permissions.query({name: 'clipboard-read'}).catch(() => null);
    if (!st || st.state !== 'granted') return;
    const txt = await navigator.clipboard.readText();
    const m = String(txt || '').match(/#import=([A-Za-z0-9+\-$_]+)/);
    if (!m || LS.get('sw_lastimp', '') === m[1]) return;
    LS.set('sw_lastimp', m[1]);
    handleImport(JSON.parse(LZString.decompressFromEncodedURIComponent(m[1])));
  }catch(e){}
}
importFromLink();
setTimeout(autoClipImport, 400);
window.addEventListener('focus', () => setTimeout(autoClipImport, 200));
window.addEventListener('hashchange', importFromLink);
window.addEventListener('pageshow', importFromLink);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible'){ importFromLink(); setTimeout(autoClipImport, 200); } });
})();
</script>
